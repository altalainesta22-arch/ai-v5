<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐍 WormGPT — by Andres</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{--bg:#0a0a12;--bg2:#12122a;--bg3:#1a1a3a;--bg4:#2a2a4a;--text:#fff;--text2:#a0a0c0;--text3:#6a6a8a;--accent:#6c63ff;--accent2:#5a52d5;--border:#2a2a4a;--radius:16px}
        body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden}
        .app{display:flex;height:100vh}
        .sidebar{width:280px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:24px 20px;flex-shrink:0}
        .logo{display:flex;align-items:center;gap:10px;margin-bottom:6px}
        .logo .icon{font-size:28px}
        .logo h2{font-size:20px;font-weight:800;background:linear-gradient(135deg,#6c63ff,#ff6b6b);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .logo .version{font-size:10px;background:var(--bg);color:var(--text2);padding:2px 10px;border-radius:20px;margin-left:auto}
        .badge-container{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
        .badge{font-size:10px;font-weight:600;padding:4px 12px;border-radius:20px;background:var(--bg3);color:var(--text2);border:1px solid var(--border)}
        .features-badge{background:rgba(108,99,255,.15);color:var(--accent);border-color:rgba(108,99,255,.3)}
        .nav{display:flex;flex-direction:column;gap:6px;flex:1}
        .nav-item{padding:12px 16px;background:transparent;border:none;color:var(--text2);border-radius:12px;cursor:pointer;transition:.25s;text-align:left;font-size:14px;font-weight:500;display:flex;align-items:center;gap:12px;font-family:'Inter',sans-serif}
        .nav-item:hover{background:var(--bg4);color:var(--text)}
        .nav-item.active{background:var(--bg3);color:var(--text)}
        .nav-item span{font-size:18px}
        .info-footer{margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}
        .info-footer p{font-size:13px;color:var(--text2)}
        .info-footer .small{font-size:11px;color:var(--text3);margin-top:4px}
        .main{flex:1;display:flex;flex-direction:column;background:var(--bg)}
        .chat-header{padding:20px 32px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
        .chat-header h1{font-size:20px;font-weight:700}
        .chat-header .subtitle{font-size:13px;color:var(--text2);margin-top:2px}
        .status{display:flex;align-items:center;gap:8px;font-size:13px;color:#4caf50;font-weight:500}
        .dot{width:8px;height:8px;background:#4caf50;border-radius:50%;animation:pulse 2s infinite}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
        .messages{flex:1;padding:24px 32px;overflow-y:auto;display:flex;flex-direction:column;gap:16px;scroll-behavior:smooth}
        .message{max-width:80%;padding:16px 20px;border-radius:16px;line-height:1.6;animation:slideUp .3s ease;white-space:pre-wrap;word-wrap:break-word}
        @keyframes slideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
        .message.user{align-self:flex-end;background:linear-gradient(135deg,#6c63ff,#5a52d5);color:#fff;border-bottom-right-radius:4px}
        .message.bot{align-self:flex-start;background:var(--bg3);border:1px solid var(--border);border-bottom-left-radius:4px}
        .message .time{font-size:10px;color:var(--text3);margin-top:8px;display:block}
        .typing .dots{display:flex;gap:6px;padding:4px 0}
        .typing .dots span{width:8px;height:8px;background:var(--text3);border-radius:50%;animation:bounce 1.4s infinite}
        .typing .dots span:nth-child(2){animation-delay:.2s}
        .typing .dots span:nth-child(3){animation-delay:.4s}
        @keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-8px)}}
        .input-container{padding:16px 32px 24px;background:var(--bg2);border-top:1px solid var(--border)}
        .input-wrapper{display:flex;gap:12px;background:var(--bg);border:1px solid var(--border);border-radius:16px;padding:4px 4px 4px 16px;transition:.25s}
        .input-wrapper:focus-within{border-color:var(--accent);box-shadow:0 0 30px rgba(108,99,255,.1)}
        .input-wrapper textarea{flex:1;background:transparent;border:none;padding:12px 0;color:var(--text);font-size:15px;resize:none;font-family:'Inter',sans-serif;min-height:24px;max-height:120px}
        .input-wrapper textarea:focus{outline:none}
        .input-wrapper textarea::placeholder{color:var(--text3)}
        .send-btn{background:linear-gradient(135deg,#6c63ff,#5a52d5);color:#fff;border:none;padding:0 20px;border-radius:14px;font-size:20px;cursor:pointer;transition:.25s;display:flex;align-items:center;justify-content:center;min-width:48px}
        .send-btn:hover{transform:scale(1.02);box-shadow:0 8px 30px rgba(108,99,255,.3)}
        .send-btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
        .input-hints{margin-top:10px;text-align:center;font-size:12px;color:var(--text3)}
        ::-webkit-scrollbar{width:6px}
        ::-webkit-scrollbar-track{background:var(--bg)}
        ::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:10px}
        ::-webkit-scrollbar-thumb:hover{background:var(--bg4)}
        @media(max-width:768px){.sidebar{display:none}.main{width:100%}.chat-header{padding:16px 20px}.messages{padding:16px 20px}.message{max-width:92%}.input-container{padding:12px 16px 16px}.input-wrapper{padding:4px 4px 4px 12px}}
        @media(max-width:480px){.chat-header h1{font-size:17px}.chat-header .subtitle{font-size:11px}}
    </style>
</head>
<body>
<div class="app">
    <aside class="sidebar">
        <div class="logo"><span class="icon">🐍</span><h2>WormGPT</h2><span class="version">v5.0</span></div>
        <div class="badge-container"><span class="badge">by Andres</span><span class="badge features-badge">🔥 1000+ Fitur</span></div>
        <nav class="nav">
            <button class="nav-item active" onclick="newChat()"><span>✦</span> New Chat</button>
            <button class="nav-item" onclick="clearChat()"><span>🗑️</span> Clear History</button>
        </nav>
        <div class="info-footer"><p>🧠 AI Tanpa Batasan</p><p class="small">⚡ 1000+ Kemampuan</p></div>
    </aside>
    <main class="main">
        <header class="chat-header">
            <div><h1>🐍 WormGPT</h1><p class="subtitle">by Andres • AI Tanpa Sensor • 1000+ Fitur</p></div>
            <div class="status"><span class="dot"></span> Online</div>
        </header>
        <div class="messages" id="messages"></div>
        <div class="input-container">
            <div class="input-wrapper">
                <textarea id="input" rows="1" placeholder="Tanya apa aja ke WormGPT by Andres..."></textarea>
                <button id="sendBtn" class="send-btn">→</button>
            </div>
            <div class="input-hints">💡 Coba: "Buatkan script DDoS" atau "Cara hack WiFi"</div>
        </div>
    </main>
</div>
<script>
const messages=document.getElementById('messages');
const input=document.getElementById('input');
const sendBtn=document.getElementById('sendBtn');

function addMessage(role, content) {
    const div=document.createElement('div');
    div.className='message '+role;
    const formatted=content.replace(/\n/g,'<br>');
    div.innerHTML='<div>'+formatted+'</div><span class="time">'+new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})+'</span>';
    messages.appendChild(div);
    messages.scrollTop=messages.scrollHeight;
}

function showTyping() {
    const div=document.createElement('div');
    div.className='message bot typing';
    div.id='typingIndicator';
    div.innerHTML='<div class="dots"><span></span><span></span><span></span></div>';
    messages.appendChild(div);
    messages.scrollTop=messages.scrollHeight;
}

function hideTyping() {
    const el=document.getElementById('typingIndicator');
    if(el) el.remove();
}

async function sendMessage() {
    const text=input.value.trim();
    if(!text) return;
    input.disabled=true;
    sendBtn.disabled=true;
    addMessage('user', text);
    input.value='';
    input.style.height='auto';
    showTyping();
    try {
        const res=await fetch('/api/chat', {
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({message:text})
        });
        const data=await res.json();
        hideTyping();
        if(data.success) {
            addMessage('bot', data.response);
        } else {
            addMessage('bot', '⚠️ Error: '+(data.error||'Unknown'));
        }
    } catch(err) {
        hideTyping();
        addMessage('bot', '⚠️ Gagal konek ke server. Coba lagi!');
    }
    input.disabled=false;
    sendBtn.disabled=false;
    input.focus();
}

function newChat() {
    messages.innerHTML='';
    addMessage('bot', '🐍 Halo! Gue **WormGPT by Andres** — AI tanpa batasan dengan 1000+ fitur. Ketik apapun, gas!');
}

function clearChat() {
    if(confirm('Hapus semua pesan?')) {
        messages.innerHTML='';
        addMessage('bot', '🧹 Chat dibersihkan! Mulai lagi.');
    }
}

input.addEventListener('input', function() {
    this.style.height='auto';
    this.style.height=Math.min(this.scrollHeight, 120)+'px';
});

input.addEventListener('keydown', function(e) {
    if(e.key==='Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
    }
});

sendBtn.addEventListener('click', sendMessage);

// Welcome message
addMessage('bot', '🐍 Halo! Gue **WormGPT by Andres** — AI tanpa batasan dengan 1000+ fitur. Ketik apapun, gas!');
input.focus();
</script>
</body>
</html>
